[project]
name = "pytermstyle"
version = "0.1.1"
description = "House terminal style for Python CLIs: palette, section header, and help grammar"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
# SPDX expression plus license-files, per PEP 639. The older
# license = { text = "MIT" } paired with a License :: OSI Approved classifier is
# deprecated, and uv warns on it at build time.
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["cli", "terminal", "ansi", "color", "help", "formatting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# A library floors lower than an application, because raising a floor excludes
# callers. A consumer a release behind must still be able to resolve this.
requires-python = ">=3.11"

# Stdlib only, and this stays empty. Every consumer is a single-file CLI that
# imports this for its palette alone, and several of them declare their whole
# dependency list in a PEP 723 header — a transitive dependency here is one they
# did not ask for.
dependencies = []

[project.urls]
Repository = "https://github.com/datapointchris/pytermstyle"
Issues = "https://github.com/datapointchris/pytermstyle/issues"
Changelog = "https://github.com/datapointchris/pytermstyle/releases"

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.12.5",
]

[tool.semantic_release]
# A feature release on 0.x stays on 0.x. python-semantic-release v10 defaults
# this to false, which makes the next release of a 0.x project 1.0.0.
allow_zero_version = true
# 1.0 is a compatibility promise, so a breaking change on 0.x is a minor bump.
# Removing this key is how the project reaches 1.0.
major_on_zero = false
version_toml = ["pyproject.toml:project.version"]
commit_message = "build(release): {version}"
# Reads the uv-lock hook's rev, the one uv release every uv.lock writer runs.
build_command = '''
    pip install "uv==$(python -c 'import re; print(re.search(r"uv-pre-commit\s+rev: \"?([\w.]+)", open(".pre-commit-config.yaml").read())[1])')"
    uv lock --upgrade-package pytermstyle
    git add uv.lock
'''

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "ICN",  # flake8-import-conventions
    # flake8-bandit by rule, never as the family. Most of what the family
    # reports is a subprocess call made on purpose, and silencing that takes an
    # ignore list that grows with every project.
    "S102",  # exec
    "S113",  # an HTTP request with no timeout, which can hang forever
    "S301",  # pickle, which runs code from the bytes it loads
    "S307",  # eval
    "S324",  # md5 or sha1 used for security
    "S501",  # TLS certificate verification turned off
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["datetime", "pyspark.sql.functions", "pyspark.sql.types"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
datetime = "dt"
sqlalchemy = "sa"
"pyspark.sql.functions" = "sf"
"pyspark.sql.types" = "st"
dataclasses = "dc"

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.codespell]
check-filenames = true
check-hidden = true
builtin = "clear,rare"
uri-ignore-words-list = "*"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
verbosity_assertions = 2

[tool.forge]
# Keys the shared toolchain standard owns, written by its generator.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "flake8-import-conventions", "banned-from"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "datetime"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "dataclasses"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "sqlalchemy"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "pyspark.sql.functions"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "pyspark.sql.types"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["codespell", "check-hidden"],
    ["codespell", "builtin"],
    ["codespell", "uri-ignore-words-list"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]
# Dependencies held at the version the pre-commit hook runs, in every group
# and extra that names them, so a local run and CI cannot disagree.
pinned = ["ruff"]

[build-system]
# Upper bound tracks the backend's own minor series, not the uv release that
# happened to be current when the repo was created. The inherited <0.12.0 pin
# already excluded the installed uv, which warns on every build by a consumer.
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pytermstyle"
module-root = "src"
