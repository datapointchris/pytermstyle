name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race, and the later
# run fails pushing its version bump onto a ref that has already moved.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # python-semantic-release decides the version from the commit types, writes it
  # into pyproject.toml, tags, and creates the GitHub release.
  #
  # There is no publish job. pytermstyle is consumed as a git dependency pinned
  # to a release tag, moving to the private index later, so the tag IS the
  # artifact and there is nothing to upload. Do not restore the publish job from
  # a sibling repo's workflow: the name is taken on public PyPI by an unrelated
  # package, and new projects do not go there regardless.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: python-semantic-release/python-semantic-release@v9
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The GitHub release body is the changelog. python-semantic-release
          # builds those notes from the same commits, and by a path independent
          # of the changelog file, so no CHANGELOG.md is written or tracked.
          changelog: "false"
